<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خزنة القضايا السرية</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #f4f6f8; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: white; border-radius: 12px; padding: 25px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .icon { font-size: 40px; margin-bottom: 10px; }
        h2 { color: #1e293b; margin-bottom: 8px; }
        p { color: #64748b; font-size: 14px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; margin-bottom: 15px; outline: none; text-align: center; }
        button { width: 100%; padding: 12px; background: #0f172a; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #334155; }
        .error { color: #ef4444; font-size: 13px; margin-top: 10px; display: none; }
        .hidden { display: none; }
        .files-container { background: white; border-radius: 12px; padding: 25px; width: 100%; max-width: 800px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .files-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #e2e8f0; }
        .files-header h2 { margin: 0; }
        .files-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .file-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.3s ease; }
        .file-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-color: #94a3b8; }
        .file-card .file-icon { font-size: 35px; margin-bottom: 10px; }
        .file-card h3 { color: #1e293b; font-size: 1.1rem; margin-bottom: 5px; }
        .file-card p { color: #64748b; font-size: 0.8rem; margin: 0; }
        .clients-container { background: white; border-radius: 12px; padding: 25px; width: 100%; max-width: 800px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .back-btn { background: #64748b; margin-bottom: 15px; }
        .back-btn:hover { background: #475569; }
        .add-btn { background: #059669; margin-bottom: 15px; }
        .add-btn:hover { background: #047857; }
        .clients-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .client-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; text-align: center; cursor: pointer; transition: all 0.3s ease; }
        .client-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .client-card .client-icon { font-size: 30px; margin-bottom: 8px; }
        .client-card h4 { color: #1e293b; font-size: 1rem; }
        .client-card p { color: #64748b; font-size: 0.7rem; margin: 0; }
        .client-files-container { background: white; border-radius: 12px; padding: 25px; width: 100%; max-width: 800px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .upload-btn { background: #2563eb; margin-bottom: 15px; }
        .upload-btn:hover { background: #1d4ed8; }
        .files-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .uploaded-file-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; text-align: center; transition: all 0.3s ease; }
        .uploaded-file-card:hover { box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .uploaded-file-card .file-type-icon { font-size: 30px; margin-bottom: 8px; }
        .uploaded-file-card h5 { color: #1e293b; font-size: 0.85rem; margin-bottom: 8px; word-break: break-all; }
        .uploaded-file-card .download-link { display: inline-block; padding: 6px 15px; background: #0f172a; color: white; text-decoration: none; border-radius: 5px; font-size: 0.8rem; }
        .uploaded-file-card .download-link:hover { background: #334155; }
        .no-items { color: #94a3b8; text-align: center; padding: 30px 0; }
        .loading { color: #2563eb; text-align: center; padding: 20px; }
    </style>
</head>
<body>

    <div id="loginPage" class="card">
        <div class="icon">🔒</div>
        <h2>الخزنة السرية</h2>
        <p>أدخل كلمة السر لفتح الخزنة</p>
        <input type="password" id="passInput" placeholder="أدخل كلمة السر">
        <br><br>
        <button type="button" onclick="checkPassword()">فتح الخزنة</button>
        <br><br>
        <div id="errorMsg" class="error">❌ كلمة السر غير صحيحة!</div>
    </div>

    <div id="filesPage" class="files-container hidden">
        <div class="files-header">
            <h2>📂 ملفات القضايا</h2>
            <button type="button" onclick="logout()" style="width: auto; padding: 8px 20px; background: #dc2626;">قفل الخزنة</button>
        </div>
        <div class="files-grid" id="filesGrid"></div>
    </div>

    <div id="clientsPage" class="clients-container hidden">
        <button type="button" class="back-btn" onclick="goBackToFiles()">🔙 رجوع للملفات</button>
        <h2 id="clientsTitle" style="margin-bottom: 15px;"></h2>
        <button type="button" class="add-btn" onclick="addClient()">➕ إضافة موكل</button>
        <div class="clients-list" id="clientsList"></div>
    </div>

    <div id="clientFilesPage" class="client-files-container hidden">
        <button type="button" class="back-btn" onclick="goBackToClients()">🔙 رجوع للموكلين</button>
        <h2 id="clientFilesTitle" style="margin-bottom: 15px;"></h2>
        <button type="button" class="upload-btn" onclick="uploadFiles()">📤 رفع مستندات</button>
        <input type="file" id="fileInput" multiple style="display:none;">
        <div class="files-list" id="clientFilesList"></div>
    </div>

    <script>
        const CORRECT_PASSWORD = '1234';
        const API_URL = 'https://script.google.com/macros/s/AKfycbx5qQ9oBtKTar-e2CGCMQM9H34Fyq2AgTofh6JGt8VLFAFCxAaJCfQ4vjLAJTudVarAOA/exec';

        const filesData = [
            { name: 'القضايا الشرعية', icon: '📜' },
            { name: 'القضايا الإدارية', icon: '🏛️' },
            { name: 'القضايا الجنائية', icon: '⚖️' },
            { name: 'القضايا المدنية', icon: '🏠' },
            { name: 'القضايا الحقوقية', icon: '👥' },
            { name: 'التوثيقات', icon: '📑' }
        ];

        let currentFile = '';
        let currentClient = '';

        function checkPassword() {
            var password = document.getElementById('passInput').value;
            var errorMsg = document.getElementById('errorMsg');

            if (password === CORRECT_PASSWORD) {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('filesPage').style.display = 'block';
                errorMsg.style.display = 'none';
                renderFiles();
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('passInput').value = '';
                document.getElementById('passInput').focus();
            }
        }

        function logout() {
            document.getElementById('filesPage').style.display = 'none';
            document.getElementById('clientsPage').style.display = 'none';
            document.getElementById('clientFilesPage').style.display = 'none';
            document.getElementById('loginPage').style.display = 'block';
            document.getElementById('passInput').value = '';
        }

        function goBackToFiles() {
            document.getElementById('clientsPage').style.display = 'none';
            document.getElementById('filesPage').style.display = 'block';
        }

        function goBackToClients() {
            document.getElementById('clientFilesPage').style.display = 'none';
            document.getElementById('clientsPage').style.display = 'block';
        }

        function renderFiles() {
            var grid = document.getElementById('filesGrid');
            grid.innerHTML = '';
            filesData.forEach(function(file) {
                var card = document.createElement('div');
                card.className = 'file-card';
                card.innerHTML = `<div class="file-icon">${file.icon}</div><h3>${file.name}</h3><p>اضغط لفتح الملف</p>`;
                card.onclick = function() { openFile(file.name); };
                grid.appendChild(card);
            });
        }

        function openFile(fileName) {
            currentFile = fileName;
            document.getElementById('filesPage').style.display = 'none';
            document.getElementById('clientsPage').style.display = 'block';
            document.getElementById('clientsTitle').textContent = '📁 ' + fileName;
            loadClients();
        }

        function loadClients() {
            var list = document.getElementById('clientsList');
            list.innerHTML = '<div class="loading">جاري تحميل الموكلين...</div>';
            fetch(`${API_URL}?action=getClients&category=${encodeURIComponent(currentFile)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        renderClients(data.clients);
                    } else {
                        list.innerHTML = '<div class="no-items">تعذر تحميل الموكلين.</div>';
                    }
                })
                .catch(err => {
                    list.innerHTML = '<div class="no-items">خطأ في الاتصال بالخادم.</div>';
                });
        }

        function renderClients(clients) {
            var list = document.getElementById('clientsList');
            list.innerHTML = '';
            if (!clients || clients.length === 0) {
                list.innerHTML = '<div class="no-items">لا يوجد موكلون بعد. اضغط "إضافة موكل".</div>';
                return;
            }
            clients.forEach(function(client) {
                var card = document.createElement('div');
                card.className = 'client-card';
                card.innerHTML = `<div class="client-icon">👤</div><h4>${client.name}</h4><p>تاريخ الإضافة: ${new Date(client.dateCreated).toLocaleDateString('ar-EG')}</p>`;
                card.onclick = function() { openClientFiles(client.name); };
                list.appendChild(card);
            });
        }

        function addClient() {
            var clientName = prompt('أدخل اسم الموكل:');
            if (clientName && clientName.trim() !== '') {
                fetch(`${API_URL}?action=createClient&category=${encodeURIComponent(currentFile)}&clientName=${encodeURIComponent(clientName.trim())}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            loadClients();
                        } else {
                            alert('فشل إنشاء الموكل: ' + data.error);
                        }
                    })
                    .catch(err => alert('خطأ في الاتصال'));
            }
        }

        function openClientFiles(clientName) {
            currentClient = clientName;
            document.getElementById('clientsPage').style.display = 'none';
            document.getElementById('clientFilesPage').style.display = 'block';
            document.getElementById('clientFilesTitle').textContent = '👤 ' + clientName;
            loadClientFiles();
        }

        function loadClientFiles() {
            var list = document.getElementById('clientFilesList');
            list.innerHTML = '<div class="loading">جاري تحميل الملفات...</div>';
            fetch(`${API_URL}?action=getClientFiles&category=${encodeURIComponent(currentFile)}&clientName=${encodeURIComponent(currentClient)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        renderClientFiles(data.files);
                    } else {
                        list.innerHTML = '<div class="no-items">تعذر تحميل الملفات.</div>';
                    }
                })
                .catch(err => {
                    list.innerHTML = '<div class="no-items">خطأ في الاتصال.</div>';
                });
        }

        function renderClientFiles(files) {
            var list = document.getElementById('clientFilesList');
            list.innerHTML = '';
            if (!files || files.length === 0) {
                list.innerHTML = '<div class="no-items">لا توجد مستندات مرفوعة بعد.</div>';
                return;
            }
            files.forEach(function(file) {
                var card = document.createElement('div');
                card.className = 'uploaded-file-card';
                var icon = getFileIcon(file.mimeType);
                card.innerHTML = `<div class="file-type-icon">${icon}</div><h5>${file.name}</h5><a href="${file.url}" target="_blank" class="download-link">⬇️ تحميل</a>`;
                list.appendChild(card);
            });
        }

        function getFileIcon(mimeType) {
            if (mimeType.startsWith('image/')) return '🖼️';
            if (mimeType.includes('pdf')) return '📄';
            if (mimeType.includes('word')) return '📝';
            if (mimeType.includes('excel') || mimeType.includes('sheet')) return '📊';
            if (mimeType.includes('powerpoint') || mimeType.includes('presentation')) return '📽️';
            if (mimeType.startsWith('audio/')) return '🎵';
            if (mimeType.startsWith('video/')) return '🎬';
            if (mimeType === 'text/plain') return '📃';
            return '📎';
        }

        function uploadFiles() {
            document.getElementById('fileInput').click();
        }

        document.getElementById('fileInput').addEventListener('change', function(e) {
            var files = e.target.files;
            if (!files.length) return;
            for (var i = 0; i < files.length; i++) {
                uploadSingleFile(files[i]);
            }
            e.target.value = '';
        });

        function uploadSingleFile(file) {
            var reader = new FileReader();
            reader.onload = function(e) {
                var base64 = e.target.result.split(',')[1];
                var formData = new FormData();
                formData.append('action', 'uploadFile');
                formData.append('category', currentFile);
                formData.append('clientName', currentClient);
                formData.append('fileName', file.name);
                formData.append('fileBase64', base64);
                formData.append('mimeType', file.type);
                fetch(API_URL, {
                    method: 'POST',
                    body: formData
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        loadClientFiles();
                    } else {
                        alert('فشل رفع الملف: ' + data.error);
                    }
                })
                .catch(err => alert('خطأ في رفع الملف'));
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
