<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خزنة القضايا السرية</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #f4f6f8; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: white; border-radius: 12px; padding: 25px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .icon { font-size: 40px; margin-bottom: 10px; }
        h2 { color: #1e293b; margin-bottom: 8px; }
        p { color: #64748b; font-size: 14px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; margin-bottom: 15px; outline: none; text-align: center; }
        button { width: 100%; padding: 12px; background: #0f172a; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #334155; }
        .error { color: #ef4444; font-size: 13px; margin-top: 10px; display: none; }
        .hidden { display: none; }
        .files-container { background: white; border-radius: 12px; padding: 25px; width: 100%; max-width: 800px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .files-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #e2e8f0; }
        .files-header h2 { margin: 0; }
        .files-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .file-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.3s ease; }
        .file-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-color: #94a3b8; }
        .file-card .file-icon { font-size: 35px; margin-bottom: 10px; }
        .file-card h3 { color: #1e293b; font-size: 1.1rem; margin-bottom: 5px; }
        .file-card p { color: #64748b; font-size: 0.8rem; margin: 0; }
        .clients-container { background: white; border-radius: 12px; padding: 25px; width: 100%; max-width: 800px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .back-btn { background: #64748b; margin-bottom: 15px; }
        .back-btn:hover { background: #475569; }
        .add-btn { background: #059669; margin-bottom: 15px; }
        .add-btn:hover { background: #047857; }
        .clients-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .client-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; text-align: center; cursor: pointer; transition: all 0.3s ease; }
        .client-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .client-card .client-icon { font-size: 30px; margin-bottom: 8px; }
        .client-card h4 { color: #1e293b; font-size: 1rem; }
        .client-card p { color: #64748b; font-size: 0.7rem; margin: 0; }
        .client-files-container { background: white; border-radius: 12px; padding: 25px; width: 100%; max-width: 800px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .upload-btn { background: #2563eb; margin-bottom: 15px; }
        .upload-btn:hover { background: #1d4ed8; }
        .no-items { color: #94a3b8; text-align: center; padding: 30px 0; }
        .loading { color: #2563eb; text-align: center; padding: 20px; }
        
        /* أزرار العرض */
        .view-controls { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; flex-wrap: wrap; }
        .view-btn { padding: 8px 15px; background: #e2e8f0; color: #1e293b; border: 2px solid #cbd5e1; border-radius: 8px; cursor: pointer; font-size: 0.85rem; transition: 0.3s; width: auto; }
        .view-btn.active { background: #2563eb; color: white; border-color: #2563eb; }
        .view-btn:hover { background: #334155; color: white; }
        .size-btn { padding: 8px 15px; background: #f1f5f9; color: #1e293b; border: 2px solid #cbd5e1; border-radius: 8px; cursor: pointer; font-size: 0.8rem; transition: 0.3s; width: auto; }
        .size-btn.active { background: #059669; color: white; border-color: #059669; }
        .size-btn:hover { background: #047857; color: white; }
        
        /* عرض شبكي */
        .files-grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .files-grid-view.size-large { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; }
        .files-grid-view.size-medium { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .files-grid-view.size-normal { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        
        /* عرض قائمة */
        .files-list-view { display: flex; flex-direction: column; gap: 10px; }
        .files-list-view .file-list-item { display: flex; align-items: center; gap: 15px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 15px; transition: 0.3s; cursor: pointer; }
        .files-list-view .file-list-item:hover { box-shadow: 0 5px 15px rgba(0,0,0,0.1); background: #fff; }
        .files-list-view .file-list-icon { font-size: 30px; flex-shrink: 0; }
        .files-list-view .file-list-info { flex: 1; text-align: right; }
        .files-list-view .file-list-name { color: #1e293b; font-size: 0.9rem; font-weight: 600; word-break: break-all; }
        .files-list-view .file-list-size { color: #64748b; font-size: 0.75rem; margin-top: 3px; }
        .files-list-view .file-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .files-list-view .file-actions button { padding: 5px 10px; border-radius: 5px; font-size: 0.75rem; width: auto; cursor: pointer; border: none; }
        
        /* بطاقة ملف */
        .file-card-item { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; text-align: center; transition: 0.3s; position: relative; cursor: pointer; }
        .file-card-item:hover { box-shadow: 0 5px 20px rgba(0,0,0,0.15); transform: translateY(-3px); }
        .file-card-item.size-large .file-preview { width: 100%; height: 200px; font-size: 80px; }
        .file-card-item.size-medium .file-preview { width: 100%; height: 140px; font-size: 50px; }
        .file-card-item.size-normal .file-preview { width: 100%; height: 100px; font-size: 35px; }
        .file-preview { display: flex; align-items: center; justify-content: center; border-radius: 8px; margin-bottom: 10px; overflow: hidden; background: #f1f5f9; }
        .file-preview img { max-width: 100%; max-height: 100%; object-fit: cover; border-radius: 5px; }
        .file-name { color: #1e293b; font-size: 0.8rem; font-weight: 600; margin-bottom: 8px; word-break: break-all; min-height: 32px; display: flex; align-items: center; justify-content: center; }
        .file-actions-grid { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
        .file-actions-grid button { padding: 4px 8px; border-radius: 5px; font-size: 0.7rem; width: auto; cursor: pointer; border: none; }
        .btn-download { background: #2563eb; color: white; }
        .btn-download:hover { background: #1d4ed8; }
        .btn-copy { background: #059669; color: white; }
        .btn-copy:hover { background: #047857; }
        .btn-delete { background: #dc2626; color: white; }
        .btn-delete:hover { background: #b91c1c; }
    </style>
</head>
<body>

    <div id="loginPage" class="card">
        <div class="icon">🔒</div>
        <h2>الخزنة السرية</h2>
        <p>أدخل كلمة السر لفتح الخزنة</p>
        <input type="password" id="passInput" placeholder="أدخل كلمة السر">
        <br><br>
        <button type="button" onclick="checkPassword()">فتح الخزنة</button>
        <br><br>
        <div id="errorMsg" class="error">❌ كلمة السر غير صحيحة!</div>
    </div>

    <div id="filesPage" class="files-container hidden">
        <div class="files-header">
            <h2>📂 ملفات القضايا</h2>
            <button type="button" onclick="logout()" style="width: auto; padding: 8px 20px; background: #dc2626;">قفل الخزنة</button>
        </div>
        <div class="files-grid" id="filesGrid"></div>
    </div>

    <div id="clientsPage" class="clients-container hidden">
        <button type="button" class="back-btn" onclick="goBackToFiles()">🔙 رجوع للملفات</button>
        <h2 id="clientsTitle" style="margin-bottom: 15px;"></h2>
        <button type="button" class="add-btn" onclick="addClient()">➕ إضافة موكل</button>
        <div class="clients-list" id="clientsList"></div>
    </div>

    <div id="clientFilesPage" class="client-files-container hidden">
        <button type="button" class="back-btn" onclick="goBackToClients()">🔙 رجوع للموكلين</button>
        <h2 id="clientFilesTitle" style="margin-bottom: 15px;"></h2>
        <button type="button" class="upload-btn" onclick="uploadFiles()">📤 رفع مستندات</button>
        <input type="file" id="fileInput" multiple style="display:none;">
        
        <div class="view-controls">
            <button class="view-btn active" onclick="setView('grid')" id="gridViewBtn">📦 شبكة</button>
            <button class="view-btn" onclick="setView('list')" id="listViewBtn">📋 قائمة</button>
            <span style="margin: 0 5px;">|</span>
            <button class="size-btn active" onclick="setSize('normal')" id="sizeNormalBtn">عادي</button>
            <button class="size-btn" onclick="setSize('medium')" id="sizeMediumBtn">متوسط</button>
            <button class="size-btn" onclick="setSize('large')" id="sizeLargeBtn">كبير</button>
        </div>
        
        <div class="files-list" id="clientFilesList"></div>
    </div>

    <script>
        const CORRECT_PASSWORD = '1234';
        const API_URL = 'https://script.google.com/macros/s/AKfycbx5qQ9oBtKTar-e2CGCMQM9H34Fyq2AgTofh6JGt8VLFAFCxAaJCfQ4vjLAJTudVarAOA/exec';

        const filesData = [
            { name: 'القضايا الشرعية', icon: '📜' },
            { name: 'القضايا الإدارية', icon: '🏛️' },
            { name: 'القضايا الجنائية', icon: '⚖️' },
            { name: 'القضايا المدنية', icon: '🏠' },
            { name: 'القضايا الحقوقية', icon: '👥' },
            { name: 'التوثيقات', icon: '📑' }
        ];

        let currentFile = '';
        let currentClient = '';
        let currentView = 'grid';
        let currentSize = 'normal';
        let allClientFiles = [];
        let longPressTimer = null;

        function checkPassword() {
            var password = document.getElementById('passInput').value;
            var errorMsg = document.getElementById('errorMsg');
            if (password === CORRECT_PASSWORD) {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('filesPage').style.display = 'block';
                errorMsg.style.display = 'none';
                renderFiles();
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('passInput').value = '';
            }
        }

        function logout() {
            document.getElementById('filesPage').style.display = 'none';
            document.getElementById('clientsPage').style.display = 'none';
            document.getElementById('clientFilesPage').style.display = 'none';
            document.getElementById('loginPage').style.display = 'block';
        }

        function goBackToFiles() {
            document.getElementById('clientsPage').style.display = 'none';
            document.getElementById('filesPage').style.display = 'block';
        }

        function goBackToClients() {
            document.getElementById('clientFilesPage').style.display = 'none';
            document.getElementById('clientsPage').style.display = 'block';
        }

        function renderFiles() {
            var grid = document.getElementById('filesGrid');
            grid.innerHTML = '';
            filesData.forEach(function(file) {
                var card = document.createElement('div');
                card.className = 'file-card';
                card.innerHTML = `<div class="file-icon">${file.icon}</div><h3>${file.name}</h3><p>اضغط لفتح الملف</p>`;
                card.onclick = function() { openFile(file.name); };
                grid.appendChild(card);
            });
        }

        function openFile(fileName) {
            currentFile = fileName;
            document.getElementById('filesPage').style.display = 'none';
            document.getElementById('clientsPage').style.display = 'block';
            document.getElementById('clientsTitle').textContent = '📁 ' + fileName;
            loadClients();
        }

        function loadClients() {
            var list = document.getElementById('clientsList');
            list.innerHTML = '<div class="loading">جاري تحميل الموكلين...</div>';
            fetch(`${API_URL}?action=getClients&category=${encodeURIComponent(currentFile)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) { renderClients(data.clients); }
                    else { list.innerHTML = '<div class="no-items">تعذر تحميل الموكلين.</div>'; }
                })
                .catch(() => { list.innerHTML = '<div class="no-items">خطأ في الاتصال.</div>'; });
        }

        function renderClients(clients) {
            var list = document.getElementById('clientsList');
            list.innerHTML = '';
            if (!clients || clients.length === 0) {
                list.innerHTML = '<div class="no-items">لا يوجد موكلون بعد.</div>';
                return;
            }
            clients.forEach(function(client) {
                var card = document.createElement('div');
                card.className = 'client-card';
                card.innerHTML = `<div class="client-icon">👤</div><h4>${client.name}</h4><p>${new Date(client.dateCreated).toLocaleDateString('ar-EG')}</p>`;
                card.onclick = function() { openClientFiles(client.name); };
                list.appendChild(card);
            });
        }

        function addClient() {
            var clientName = prompt('أدخل اسم الموكل:');
            if (clientName && clientName.trim() !== '') {
                fetch(`${API_URL}?action=createClient&category=${encodeURIComponent(currentFile)}&clientName=${encodeURIComponent(clientName.trim())}`)
                    .then(res => res.json())
                    .then(data => { if (data.success) { loadClients(); } else { alert('فشل: ' + data.error); } })
                    .catch(() => alert('خطأ'));
            }
        }

        function openClientFiles(clientName) {
            currentClient = clientName;
            document.getElementById('clientsPage').style.display = 'none';
            document.getElementById('clientFilesPage').style.display = 'block';
            document.getElementById('clientFilesTitle').textContent = '👤 ' + clientName;
            loadClientFiles();
        }

        function loadClientFiles() {
            var list = document.getElementById('clientFilesList');
            list.innerHTML = '<div class="loading">جاري تحميل الملفات...</div>';
            fetch(`${API_URL}?action=getClientFiles&category=${encodeURIComponent(currentFile)}&clientName=${encodeURIComponent(currentClient)}`)
                .then(res => res.json())
                .then(data => { if (data.success) { renderClientFiles(data.files); } else { list.innerHTML = '<div class="no-items">تعذر تحميل الملفات.</div>'; } })
                .catch(() => { list.innerHTML = '<div class="no-items">خطأ في الاتصال.</div>'; });
        }

        function setView(view) {
            currentView = view;
            document.getElementById('gridViewBtn').classList.toggle('active', view === 'grid');
            document.getElementById('listViewBtn').classList.toggle('active', view === 'list');
            renderClientFiles(allClientFiles);
        }

        function setSize(size) {
            currentSize = size;
            document.getElementById('sizeNormalBtn').classList.toggle('active', size === 'normal');
            document.getElementById('sizeMediumBtn').classList.toggle('active', size === 'medium');
            document.getElementById('sizeLargeBtn').classList.toggle('active', size === 'large');
            renderClientFiles(allClientFiles);
        }

        function getFileIcon(mimeType) {
            if (mimeType.startsWith('image/')) return '🖼️';
            if (mimeType.includes('pdf')) return '📄';
            if (mimeType.includes('word')) return '📝';
            if (mimeType.includes('excel') || mimeType.includes('sheet')) return '📊';
            if (mimeType.includes('powerpoint') || mimeType.includes('presentation')) return '📽️';
            if (mimeType.startsWith('audio/')) return '🎵';
            if (mimeType.startsWith('video/')) return '🎬';
            if (mimeType === 'text/plain') return '📃';
            return '📎';
        }

        function renderClientFiles(files) {
            var list = document.getElementById('clientFilesList');
            list.innerHTML = '';
            allClientFiles = files || [];
            if (!files || files.length === 0) {
                list.innerHTML = '<div class="no-items">لا توجد مستندات مرفوعة بعد.</div>';
                return;
            }

            if (currentView === 'list') {
                list.className = 'files-list-view';
                files.forEach(function(file) {
                    var item = document.createElement('div');
                    item.className = 'file-list-item';
                    var icon = getFileIcon(file.mimeType);
                    var sizeKB = (file.size / 1024).toFixed(2);
                    item.innerHTML = `
                        <div class="file-list-icon">${icon}</div>
                        <div class="file-list-info"><div class="file-list-name">${file.name}</div><div class="file-list-size">${sizeKB} KB</div></div>
                        <div class="file-actions">
                            <button class="btn-download" onclick="event.stopPropagation(); window.open('${file.url}', '_blank')">⬇️</button>
                            <button class="btn-copy" onclick="event.stopPropagation(); copyFile('${file.id}')">📋</button>
                            <button class="btn-delete" onclick="event.stopPropagation(); deleteFile('${file.id}', '${file.name}')">🗑️</button>
                        </div>`;
                    item.addEventListener('mousedown', function(e) { if (e.target.tagName !== 'BUTTON') { startLongPress(file.id, file.name); } });
                    item.addEventListener('mouseup', cancelLongPress);
                    item.addEventListener('mouseleave', cancelLongPress);
                    item.addEventListener('touchstart', function(e) { if (e.target.tagName !== 'BUTTON') { startLongPress(file.id, file.name); } });
                    item.addEventListener('touchend', cancelLongPress);
                    list.appendChild(item);
                });
            } else {
                list.className = 'files-grid-view size-' + currentSize;
                files.forEach(function(file) {
                    var card = document.createElement('div');
                    card.className = 'file-card-item size-' + currentSize;
                    var previewHTML = file.mimeType.startsWith('image/') ? `<img src="${file.url}" alt="${file.name}">` : `<span style="font-size: inherit;">${getFileIcon(file.mimeType)}</span>`;
                    card.innerHTML = `
                        <div class="file-preview">${previewHTML}</div>
                        <div class="file-name">${file.name}</div>
                        <div class="file-actions-grid">
                            <button class="btn-download" onclick="event.stopPropagation(); window.open('${file.url}', '_blank')">⬇️</button>
                            <button class="btn-copy" onclick="event.stopPropagation(); copyFile('${file.id}')">📋</button>
                            <button class="btn-delete" onclick="event.stopPropagation(); deleteFile('${file.id}', '${file.name}')">🗑️</button>
                        </div>`;
                    card.addEventListener('mousedown', function(e) { if (e.target.tagName !== 'BUTTON') { startLongPress(file.id, file.name); } });
                    card.addEventListener('mouseup', cancelLongPress);
                    card.addEventListener('mouseleave', cancelLongPress);
                    card.addEventListener('touchstart', function(e) { if (e.target.tagName !== 'BUTTON') { startLongPress(file.id, file.name); } });
                    card.addEventListener('touchend', cancelLongPress);
                    list.appendChild(card);
                });
            }
        }

        function startLongPress(fileId, fileName) {
            longPressTimer = setTimeout(function() {
                var action = prompt('📄 ' + fileName + '\n\n1 = نسخ\n2 = نقل\n3 = إلغاء');
                if (action === '1') { chooseTargetClient(fileId, fileName, 'copy'); }
                else if (action === '2') { chooseTargetClient(fileId, fileName, 'move'); }
            }, 4000);
        }

        function cancelLongPress() {
            if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
        }

        function chooseTargetClient(fileId, fileName, actionType) {
            var categories = filesData.map(function(f) { return f.name; });
            var catList = '';
            categories.forEach(function(cat, i) { catList += (i+1) + ' - ' + cat + '\n'; });
            var catChoice = prompt('اختر الفئة:\n\n' + catList);
            if (!catChoice) return;
            var catIndex = parseInt(catChoice) - 1;
            if (catIndex < 0 || catIndex >= categories.length) { alert('خطأ'); return
